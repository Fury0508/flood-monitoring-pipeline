name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint and config checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff pyyaml

      # Config lives in pyproject.toml. No format check: the notebooks are
      # Databricks source files and are intentionally not black-formatted.
      - name: ruff check
        run: ruff check .

      - name: Notebooks keep their Databricks header
        run: |
          python - <<'PY'
          import pathlib, sys

          HEADER = "# Databricks notebook source"
          bad = []
          notebooks = sorted(pathlib.Path("notebooks").rglob("*.py"))
          for nb in notebooks:
              first = nb.read_text(encoding="utf-8").splitlines()[:1]
              if not first or first[0].rstrip() != HEADER:
                  bad.append((nb, first[0] if first else "<empty file>"))

          if bad:
              print("These notebooks do not start with the Databricks header:")
              for nb, got in bad:
                  print(f"  {nb}\n      expected: {HEADER!r}\n      found:    {got!r}")
              sys.exit(1)

          print(f"OK: all {len(notebooks)} notebooks start with {HEADER!r}")
          PY

      - name: Bundle is valid and defines dev, test and prod
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          path = pathlib.Path("resources/databricks.yml")
          if not path.exists():
              sys.exit(f"FAIL: {path} is missing")

          bundle = yaml.safe_load(path.read_text(encoding="utf-8"))

          jobs = (bundle.get("resources") or {}).get("jobs") or {}
          if not jobs:
              sys.exit("FAIL: the bundle defines no jobs under resources.jobs")

          targets = bundle.get("targets") or {}
          missing = [t for t in ("dev", "test", "prod") if t not in targets]
          if missing:
              sys.exit(f"FAIL: the bundle is missing target(s): {', '.join(missing)}")

          print(f"OK: {path} parses, defines {len(jobs)} job(s): {', '.join(jobs)}")
          print(f"OK: targets present: {', '.join(targets)}")
          PY

      - name: Every task points at a notebook or a job that exists
        run: |
          python - <<'PY'
          import pathlib, re, sys, yaml

          bundle = yaml.safe_load(
              pathlib.Path("resources/databricks.yml").read_text(encoding="utf-8")
          )
          jobs = (bundle.get("resources") or {}).get("jobs") or {}

          # Basename match: bundle paths are relative to resources/, while the
          # notebooks are filed under notebooks/<layer>/.
          on_disk = {p.name for p in pathlib.Path("notebooks").rglob("*")
                     if p.suffix in (".py", ".sql")}

          # run_job_task references another job in this bundle as
          # ${resources.jobs.<key>.id}; that key has to exist here.
          job_ref = re.compile(r"\$\{resources\.jobs\.([A-Za-z0-9_-]+)\.id\}")

          problems, notebooks_checked, jobs_checked = [], 0, 0
          for job_name, job in jobs.items():
              for task in job.get("tasks") or []:
                  key = task.get("task_key")
                  if "notebook_task" in task:
                      nb = task["notebook_task"].get("notebook_path")
                      if not nb:
                          problems.append(f"job {job_name!r} task {key!r}: notebook_task has no notebook_path")
                          continue
                      notebooks_checked += 1
                      if pathlib.PurePosixPath(nb).name not in on_disk:
                          problems.append(f"job {job_name!r} task {key!r}: no notebook named {nb}")
                  elif "run_job_task" in task:
                      jobs_checked += 1
                      job_id = str(task["run_job_task"].get("job_id", ""))
                      m = job_ref.fullmatch(job_id.strip())
                      if not m:
                          problems.append(f"job {job_name!r} task {key!r}: job_id {job_id!r} is not a bundle job reference")
                      elif m.group(1) not in jobs:
                          problems.append(f"job {job_name!r} task {key!r}: references job {m.group(1)!r}, which this bundle does not define")
                  # Any other task type (SQL, pipeline, condition) is skipped.

          if problems:
              print("Bundle task references do not resolve:")
              for p in problems:
                  print(f"  {p}")
              sys.exit(1)

          print(f"OK: {notebooks_checked} notebook task(s) resolve to a file in notebooks/")
          print(f"OK: {jobs_checked} run_job task(s) reference a job defined in this bundle")
          PY

      - name: Every %run points at a notebook that exists
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # %run paths are relative to the calling notebook's own folder, so a
          # notebook that moves between folders silently breaks its helpers.
          pattern = re.compile(r"^#\s*MAGIC\s+%run\s+(\S+)")
          broken, checked = [], 0
          for nb in sorted(pathlib.Path("notebooks").rglob("*.py")):
              for lineno, line in enumerate(nb.read_text(encoding="utf-8").splitlines(), 1):
                  m = pattern.match(line)
                  if not m:
                      continue
                  checked += 1
                  target = (nb.parent / m.group(1)).resolve()
                  if not target.with_suffix(".py").exists():
                      broken.append((nb, lineno, m.group(1)))

          if broken:
              print("These %run targets do not resolve:")
              for nb, lineno, target in broken:
                  print(f"  {nb}:{lineno} -> {target}")
              sys.exit(1)

          print(f"OK: all {checked} %run targets resolve")
          PY

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pytest if there are tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "No tests/ directory in this repo yet - nothing to run."
          fi
