# Databricks Asset Bundle for the EA flood monitoring pipeline.
#
# One orchestrator job runs one child job per layer, in order:
#
#   flood_monitoring_pipeline:  landing -> bronze -> silver -> gold -> catchup
#
# Each child job runs its three entities (stations, measures, readings) in parallel and can
# be run or repaired on its own. The schedule, alerting and run_id live on the orchestrator
# only; child jobs receive the run_id so every stage of one run shares it in the run log.
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run flood_monitoring_pipeline -t dev

bundle:
  name: flood-monitoring-pipeline

# databricks.yml lives in resources/, so the notebooks sit outside the bundle root
# and must be listed explicitly to be uploaded on deploy.
sync:
  paths:
    - .
    - ../notebooks

variables:
  catalog:
    description: Unity Catalog the pipeline writes to
    default: flood_monitoring_dev
  alert_email:
    description: Address notified when a run fails
    default: guptadhananjay090@gmail.com
  schedule_status:
    description: PAUSED or UNPAUSED
    default: PAUSED

resources:
  jobs:
    # ------------------------------------------------------------------------------------
    # Orchestrator: the only job with a schedule and alerts
    # ------------------------------------------------------------------------------------
    flood_monitoring_pipeline:
      name: flood_monitoring_pipeline
      description: Runs the layer jobs in order, landing through gold.
      # One run at a time: two runs merging the same days would contend for the same rows.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mode
          default: incremental
        - name: lookback_days
          default: "3"
        - name: run_id
          default: "{{job.run_id}}"
      schedule:
        quartz_cron_expression: "0 0 */3 * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure:
          - ${var.alert_email}
        no_alert_for_skipped_runs: false
      tasks:
        - task_key: landing
          run_job_task:
            job_id: ${resources.jobs.flood_landing.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              mode: "{{job.parameters.mode}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              run_id: "{{job.parameters.run_id}}"

        - task_key: bronze
          depends_on:
            - task_key: landing
          run_job_task:
            job_id: ${resources.jobs.flood_bronze.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"

        - task_key: silver
          depends_on:
            - task_key: bronze
          run_job_task:
            job_id: ${resources.jobs.flood_silver.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"

        - task_key: gold
          depends_on:
            - task_key: silver
          run_job_task:
            job_id: ${resources.jobs.flood_gold.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"

        # Its own run id, so catch-up files and bronze rows never replace the daily run's.
        - task_key: catchup
          depends_on:
            - task_key: gold
          run_job_task:
            job_id: ${resources.jobs.flood_catchup.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              run_id: "{{job.parameters.run_id}}-catchup"

    # ------------------------------------------------------------------------------------
    # Layer jobs. Each can also run on its own: run_id then defaults to its own run id.
    # ------------------------------------------------------------------------------------
    flood_landing:
      name: flood_landing
      description: Fetches stations, measures and daily readings from the API into the landing volume.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mode
          default: incremental
        - name: lookback_days
          default: "3"
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: landing_stations
          notebook_task:
            notebook_path: ../notebooks/landing/02a_landing_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800

        - task_key: landing_measures
          notebook_task:
            notebook_path: ../notebooks/landing/02b_landing_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800

        - task_key: landing_readings
          notebook_task:
            notebook_path: ../notebooks/landing/02c_landing_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mode: "{{job.parameters.mode}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 3600

    flood_bronze:
      name: flood_bronze
      description: Loads landed files into Bronze Delta tables, reconciled against landing counts.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: run_id
          default: ""   # blank = latest successful landing run per entity
      tasks:
        - task_key: bronze_stations
          notebook_task:
            notebook_path: ../notebooks/bronze/03a_bronze_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: bronze_measures
          notebook_task:
            notebook_path: ../notebooks/bronze/03b_bronze_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: bronze_readings
          notebook_task:
            notebook_path: ../notebooks/bronze/03c_bronze_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

    flood_silver:
      name: flood_silver
      description: Types, validates and deduplicates Bronze data; rejected rows go to quarantine.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: run_id
          default: ""   # blank = latest successful bronze run per entity
      tasks:
        - task_key: silver_stations
          notebook_task:
            notebook_path: ../notebooks/silver/04a_silver_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: silver_measures
          notebook_task:
            notebook_path: ../notebooks/silver/04b_silver_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: silver_readings
          notebook_task:
            notebook_path: ../notebooks/silver/04c_silver_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

    flood_gold:
      name: flood_gold
      description: Publishes the star schema. dim_station (SCD2), dim_measure (Type 1), fact_reading (MERGE).
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: run_id
          default: ""   # blank = latest successful silver run per entity
      tasks:
        - task_key: gold_dim_station
          notebook_task:
            notebook_path: ../notebooks/gold/05a_gold_dim_station.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        # The measure dimension checks each measure against a current station.
        - task_key: gold_dim_measure
          depends_on:
            - task_key: gold_dim_station
          notebook_task:
            notebook_path: ../notebooks/gold/05b_gold_dim_measure.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        # The fact needs the measure keys.
        - task_key: gold_fact_reading
          depends_on:
            - task_key: gold_dim_measure
          notebook_task:
            notebook_path: ../notebooks/gold/05c_gold_fact_reading.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

    # Stations that went silent past the daily window and came back. Only the detect-and-fetch step is new:
    # the readings then go through the same bronze, silver and gold notebooks as the daily path.
    flood_catchup:
      name: flood_catchup
      description: Recovers readings from stations that went silent and resumed, then loads them like any other readings.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: lookback_days
          default: "3"
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: catchup_landing
          notebook_task:
            notebook_path: ../notebooks/catchup/06_catchup_silent_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              run_id: "{{job.parameters.run_id}}"
              max_measures: "200"
          max_retries: 1
          timeout_seconds: 3600

        # Skip the rest when nothing needed catching up.
        - task_key: has_readings
          depends_on:
            - task_key: catchup_landing
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.catchup_landing.values.readings_landed}}"
            right: "0"

        - task_key: bronze_readings
          depends_on:
            - task_key: has_readings
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/bronze/03c_bronze_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{tasks.catchup_landing.values.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: silver_readings
          depends_on:
            - task_key: bronze_readings
          notebook_task:
            notebook_path: ../notebooks/silver/04c_silver_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{tasks.catchup_landing.values.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: gold_fact_reading
          depends_on:
            - task_key: silver_readings
          notebook_task:
            notebook_path: ../notebooks/gold/05c_gold_fact_reading.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{tasks.catchup_landing.values.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

# Only dev is deployed in this exercise: Databricks Free Edition is a single workspace.
# test and prod are defined to show the promotion path; in a real deployment each would be
# its own workspace and only CI would deploy to them. The targets differ only in the catalog
# written to and whether the schedule is live, so promotion is a deploy, not a code change.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
    variables:
      catalog: flood_monitoring_dev
      schedule_status: PAUSED

  test:
    mode: development
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_monitoring_test
      schedule_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_monitoring
      schedule_status: UNPAUSED
    # Commented out for Databricks Free Edition, which cannot create account
    # groups: deploying with these fails because the principals do not exist.
    # On a workspace with the groups defined, uncomment to restore job-level RBAC.
    # permissions:
    #   - level: CAN_VIEW
    #     group_name: data_analysts
    #   - level: CAN_MANAGE
    #     group_name: data_engineers
