# Databricks Asset Bundle for the flood monitoring pipeline.
#
# Only the landing layer exists so far, so this bundle covers only those tasks.
# Bronze, silver, gold and the catch-up task are added to this same file as each
# layer lands.

bundle:
  name: flood-monitoring-pipeline

sync:
  paths:
    - .
    - ../notebooks

variables:
  catalog:
    description: Unity Catalog catalog this target writes to.
    default: flood_monitoring_dev
  alert_email:
    description: Address notified when a job run fails.
    default: guptadhananjay090@gmail.com
  schedule_status:
    description: Whether the schedule is live. PAUSED everywhere except prod.
    default: PAUSED

resources:
  jobs:
    flood_monitoring_pipeline:
      name: flood_monitoring_pipeline
      description: >-
        Ingests Environment Agency real-time flood monitoring data into the
        landing volume. One run at a time; the three endpoints are independent
        and run in parallel.

      # Two runs covering the same days would contend for the same rows, so
      # overlapping runs queue rather than run concurrently.
      max_concurrent_runs: 1
      queue:
        enabled: true

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mode
          default: incremental
        - name: lookback_days
          default: "3"
        - name: run_id
          default: "{{job.run_id}}"

      schedule:
        quartz_cron_expression: "0 0 */3 * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_status}

      email_notifications:
        on_failure:
          - ${var.alert_email}

      tasks:
        # No depends_on between the three: the endpoints are independent, so they
        # run in parallel and each can be retried on its own.
        - task_key: landing_stations
          notebook_task:
            notebook_path: ../notebooks/landing/02a_landing_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800

        - task_key: landing_measures
          notebook_task:
            notebook_path: ../notebooks/landing/02b_landing_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800

        - task_key: landing_readings
          notebook_task:
            notebook_path: ../notebooks/landing/02c_landing_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
              mode: "{{job.parameters.mode}}"
              lookback_days: "{{job.parameters.lookback_days}}"
          max_retries: 2
          min_retry_interval_millis: 300000
          # Readings pull several days of data, so they get longer than the
          # single-call station and measure tasks.
          timeout_seconds: 3600

        # Each bronze task depends only on its own landing task, so the three
        # chains stay independent and continue to run in parallel.
        - task_key: bronze_stations
          depends_on:
            - task_key: landing_stations
          notebook_task:
            notebook_path: ../notebooks/bronze/03a_bronze_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: bronze_measures
          depends_on:
            - task_key: landing_measures
          notebook_task:
            notebook_path: ../notebooks/bronze/03b_bronze_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: bronze_readings
          depends_on:
            - task_key: landing_readings
          notebook_task:
            notebook_path: ../notebooks/bronze/03c_bronze_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

        # Each silver task depends only on its own bronze task, keeping the three
        # chains independent all the way through the pipeline.
        - task_key: silver_stations
          depends_on:
            - task_key: bronze_stations
          notebook_task:
            notebook_path: ../notebooks/silver/04a_silver_stations.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: silver_measures
          depends_on:
            - task_key: bronze_measures
          notebook_task:
            notebook_path: ../notebooks/silver/04b_silver_measures.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: silver_readings
          depends_on:
            - task_key: bronze_readings
          notebook_task:
            notebook_path: ../notebooks/silver/04c_silver_readings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

        # The three chains converge here: the fact table needs the measure keys,
        # and the measure dimension checks each measure against a current station.
        - task_key: gold_dim_station
          depends_on:
            - task_key: silver_stations
          notebook_task:
            notebook_path: ../notebooks/gold/05a_gold_dim_station.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: gold_dim_measure
          depends_on:
            - task_key: silver_measures
            - task_key: gold_dim_station
          notebook_task:
            notebook_path: ../notebooks/gold/05b_gold_dim_measure.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 1800

        - task_key: gold_fact_reading
          depends_on:
            - task_key: silver_readings
            - task_key: gold_dim_measure
          notebook_task:
            notebook_path: ../notebooks/gold/05c_gold_fact_reading.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_id: "{{job.parameters.run_id}}"
          max_retries: 1
          timeout_seconds: 3600

# All three targets point at the same host because this is Databricks Free
# Edition, which is a single workspace. Only dev is deployed here; test and prod
# are defined to show the promotion path. In a real deployment each target would
# be its own workspace, and only CI would deploy to test and prod.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
    variables:
      catalog: flood_monitoring_dev
      schedule_status: PAUSED

  test:
    mode: development
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_monitoring_test
      schedule_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-a143a518-da52.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_monitoring
      schedule_status: UNPAUSED
    # Commented out for Databricks Free Edition, which cannot create account
    # groups: deploying with these fails because the principals do not exist.
    # On a workspace with the groups defined, uncomment to restore job-level RBAC.
    # permissions:
    #   - level: CAN_VIEW
    #     group_name: data_analysts
    #   - level: CAN_MANAGE
    #     group_name: data_engineers
