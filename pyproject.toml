[project]
name = "flood-monitoring-pipeline"
version = "0.1.0"
description = "Ingests Environment Agency real time flood monitoring data into a Databricks lakehouse"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Databricks injects spark, dbutils and display into notebooks, and %run brings in
    # helper functions, so undefined-name checks would fire on every notebook.
    "F821",
    # %run pulls helpers in as star-style globals rather than explicit imports.
    "F405",
    "E402",  # notebook cells declare widgets before imports on purpose
    "UP017", # datetime.UTC needs Python 3.11; timezone.utc works on every runtime
    # zip() pairs lists that are built together and are always the same length,
    # so the strict= argument would add noise without catching anything.
    "B905",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint.per-file-ignores]
# Notebook markdown cells (# MAGIC lines) are prose, including wide tables that
# read fine in the Databricks UI. Line length is not meaningful there, and the
# notebooks are verified as-is, so they are not rewrapped.
"notebooks/**/*.py" = [
    "E501",
    # %run injects a helper notebook's namespace into its callers, so an import
    # that looks unused here is often used by the notebook that loads it. In
    # 00_pipeline_common, `re` is used by 00_bronze_common, which never imports
    # it directly; removing it would break that notebook at runtime.
    "F401",
    # Import blocks sit inside notebook cells, where the surrounding blank lines
    # are part of the cell layout rather than style. Sorting them would mean
    # editing verified notebooks for no functional gain.
    "I001",
]
